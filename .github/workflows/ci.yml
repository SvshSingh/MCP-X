name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test + coverage
        run: npm run coverage

      # Fixture mode only: runEval always requests the fixture LLM client for
      # a non-live run, so this needs no GEMINI_API_KEY and makes no network
      # call. A scenario regressing planning, routing, or orchestration exits
      # non-zero here and turns the build red — that's the gate, not just the
      # report.
      - name: Evaluation harness
        run: npm run eval

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.md
          if-no-files-found: warn
